# FasterEdge 开源项目 - Github: https://github.com/FasterEdge - Gitee: https://gitee.com/FasterEdge
# MCU 固件 CI: 工程完整性检查。
# 说明: 固件主工程为 Keil/MDK/Arduino/厂商 IDE(闭源或容器不可编译), CI 校验工程结构与源码完整性。
name: '工程完整性检查'

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: '主工程目录检查(keil/MDK-ARM/arduino 任一)'
        run: |
          set -e
          found=0
          for d in keil MDK-ARM arduino; do
            if [ -d "$d" ]; then echo "  主工程: $d"; found=1; fi
          done
          [ "$found" -eq 1 ] || { echo "缺失主工程目录(keil/MDK-ARM/arduino)"; exit 1; }
      - name: 'platformio_ide 源码完整性'
        run: |
          set -e
          [ -f platformio_ide/platformio.ini ] || { echo "缺失 platformio_ide/platformio.ini"; exit 1; }
          n=$(find platformio_ide -maxdepth 3 \( -name '*.c' -o -name '*.cpp' -o -name '*.asm' \) -not -path '*/\.git/*' | wc -l)
          echo "  platformio_ide 源码文件数: $n"
          [ "$n" -gt 0 ] || { echo "platformio_ide 无源码"; exit 1; }
      - name: 'README 与关键文件'
        run: |
          [ -f README.md ] || { echo "缺失 README.md"; exit 1; }
          echo "  关键文件齐全"