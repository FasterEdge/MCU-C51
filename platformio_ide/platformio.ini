; FasterEdge MCU (C51 / 8051) — platformio_ide 版
; VS Code + PlatformIO 插件直接打开本目录即可编译/烧录/监视串口
; 本版本为「裸机 C + SDCC 编译器（PlatformIO STC 平台）」
;
; 使用方法（VS Code）:
;   1. 安装 PlatformIO IDE 插件
;   2. 打开本目录 (platformio_ide)
;   3. 底部状态栏点 Build / Upload / Serial Monitor
;
; 命令行:
;   pio run -d . && pio run -d . -t upload && pio device monitor
;
; 注意:
;   - STC 平台使用 SDCC 编译器（非 Keil C51）
;   - fe_port.c 为 SDCC 兼容的 8051 寄存器级实现
;   - 如需 %lu 等 long 格式化，放开 printf_large 定义
[env:stc89c52rc]
platform = stc
board = stc89c52rc
monitor_speed = 115200
build_flags =
    -DFOSC=12000000UL
    ; -Dprintf=printf_large   ; SDCC long 格式化支持

; 其他常用 STC 板子（换 board 即可，代码通用）
; [env:stc15f2k60s2]
; platform = stc
; board = stc15f2k60s2
; monitor_speed = 115200
; build_flags =
;     -DFOSC=12000000UL